name: CI - Calidad y pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Basebook-code

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de la aplicación y lint
        run: python -m pip install -r requirements.txt flake8

      - name: Revisar estilo del código
        run: python -m flake8 --extend-ignore=E402,E501,W292 .

      - name: Ejecutar las pruebas
        env:
          PYTHON_DOTENV_DISABLED: "1"
          SUPABASE_URL: ""
          SUPABASE_ANON_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
        run: python -m unittest discover -s pruebas -v
